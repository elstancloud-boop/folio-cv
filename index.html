*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--page)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--indigo);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}

.app{display:grid;grid-template-rows:auto 1fr;height:100vh;height:100dvh}
.topbar{display:flex;align-items:center;gap:16px;padding:10px 20px;background:var(--ink);color:#fff;position:relative}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:32px;height:32px;border-radius:9px;background:var(--coral);color:var(--ink);display:grid;place-items:center;font:400 20px var(--sans)}
.brand-name{font:400 22px var(--sans);letter-spacing:.2px}
.progress{flex:1;max-width:320px;height:8px;background:#2c2f4e;border-radius:99px;position:relative;margin-left:12px}
.progress-bar{height:100%;width:0;background:linear-gradient(90deg,var(--coral),#ffb347);border-radius:99px;transition:width .4s}
.progress span{position:absolute;right:-44px;top:-5px;font-size:13px;color:#c9cce6}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:10px}
.saved{font-size:12px;color:#9fa3c7}
.menu{position:absolute;right:20px;top:100%;margin-top:6px;background:#fff;color:var(--ink);border-radius:12px;box-shadow:0 12px 40px #15172b44;padding:6px;z-index:30;min-width:260px;display:grid}
.menu button{background:none;border:0;text-align:left;padding:10px 12px;border-radius:8px}
.menu button:hover{background:var(--bg)}
.menu .danger{color:#c2261a}

.btn{border:1px solid var(--line);background:#fff;padding:9px 16px;border-radius:10px;font-weight:600;transition:transform .08s,background .15s}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--coral);border-color:var(--coral);color:#1b0d08}
.btn.primary:hover{background:var(--coral-d);color:#fff}
.btn.ghost{background:transparent;color:inherit;border-color:#ffffff33}
.editor .btn.ghost,.modal .btn.ghost{border-color:var(--line);color:var(--ink)}
.btn.ghost:hover{background:#ffffff14}
.editor .btn.ghost:hover,.modal .btn.ghost:hover{background:var(--bg)}
.btn.big{padding:14px 22px;font-size:16px}
.btn.small{padding:5px 10px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.4;pointer-events:none}

.workspace{display:grid;grid-template-columns:minmax(380px,500px) 1fr;min-height:0}
.editor{display:flex;flex-direction:column;background:var(--card);min-height:0;border-right:1px solid var(--line)}
.steps{display:flex;gap:4px;padding:10px 12px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
.steps button{border:0;background:none;padding:8px 12px;border-radius:99px;font-weight:600;color:var(--mute);white-space:nowrap;display:flex;gap:6px;align-items:center}
.steps button:hover{background:var(--bg)}
.steps button[aria-current=step]{background:var(--ink);color:#fff}
.steps .tick{width:16px;height:16px;border-radius:50%;background:var(--ok);color:#fff;font-size:10px;display:grid;place-items:center}
.step-body{flex:1;overflow-y:auto;padding:22px 24px 30px;scroll-behavior:smooth}
.step-nav{display:flex;justify-content:space-between;padding:12px 20px;border-top:1px solid var(--line)}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--indigo);font-weight:700;margin:0 0 6px}
.step-body h2{font:400 28px/1.15 var(--sans);margin:0 0 6px}
.lead{color:var(--ink2);margin:0 0 20px;line-height:1.5}

.field{display:grid;gap:5px;margin-bottom:14px}
.field>label,.field>.lbl{font-size:13px;font-weight:700;color:var(--ink2)}
.field small{color:var(--mute);font-size:12px;line-height:1.4}
input[type=text],input[type=email],input[type=tel],input[type=url],input[type=month],textarea,select{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;transition:border-color .15s,box-shadow .15s}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--indigo);box-shadow:0 0 0 4px #5266eb1f}
textarea{resize:vertical;min-height:90px;line-height:1.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check{display:flex;gap:8px;align-items:center;font-size:14px;margin:-4px 0 14px}
.check input{width:18px;height:18px;accent-color:var(--indigo)}

.card{border:1.5px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;background:#fbfbfe}
.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
.card-head b{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-tools{display:flex;gap:4px}
.icon-btn{border:1px solid var(--line);background:#fff;border-radius:8px;width:30px;height:30px;line-height:1}
.icon-btn:hover{background:var(--bg)}
.add{width:100%;border:2px dashed var(--line);background:none;padding:14px;border-radius:var(--r);font-weight:700;color:var(--indigo)}
.add:hover{border-color:var(--indigo);background:#5266eb0d}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{display:inline-flex;gap:6px;align-items:center;background:var(--bg);border:1px solid var(--line);padding:5px 10px;border-radius:99px;font-size:13px;font-weight:600}
.chip button{border:0;background:none;padding:0;color:var(--mute);font-size:15px;line-height:1}
.chip.sug{background:#fff;border-style:dashed;cursor:pointer;color:var(--indigo)}
.chip.sug:hover{background:#5266eb0f}
.hint{font-size:12.5px;margin-top:4px;color:var(--mute);line-height:1.45}
.hint .bad{color:#c2261a}.hint .good{color:var(--ok)}
.tip{background:#fff6f3;border:1px solid #ffd5c9;border-radius:12px;padding:12px 14px;font-size:13.5px;line-height:1.5;color:#6b2c1c;margin-bottom:16px}
.photo-row{display:flex;gap:14px;align-items:center;margin-bottom:16px}
.avatar{width:72px;height:72px;border-radius:50%;background:var(--bg) center/cover;border:2px solid var(--line);display:grid;place-items:center;color:var(--mute);font-size:12px}

.tpl-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:18px}
.tpl{border:2px solid var(--line);border-radius:12px;background:#fff;padding:10px;text-align:left}
.tpl[aria-pressed=true]{border-color:var(--indigo);box-shadow:0 0 0 4px #5266eb1f}
.tpl svg{width:100%;height:auto;display:block;margin-bottom:6px;border-radius:6px;background:#f4f5fa}
.tpl b{font-size:14px}.tpl span{display:block;font-size:12px;color:var(--mute)}
.swatches{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--line)}
.sw[aria-pressed=true]{box-shadow:0 0 0 3px var(--ink)}
.seg{display:inline-flex;background:#fff;border-radius:99px;padding:3px;border:1px solid var(--line)}
.seg button{border:0;background:none;border-radius:99px;padding:6px 14px;font-weight:600;font-size:13px;color:var(--ink2)}
.seg button[aria-checked=true]{background:var(--ink);color:#fff}
.order{display:grid;gap:6px}
.order-row{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff}
.order-row span{flex:1;font-weight:600}
.order-row.off{opacity:.5}
input[type=range]{width:100%;accent-color:var(--indigo)}

.score{display:flex;gap:18px;align-items:center;margin-bottom:18px}
.ring{--p:0;width:96px;height:96px;border-radius:50%;background:conic-gradient(var(--c,var(--ok)) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:none}
.ring i{width:74px;height:74px;border-radius:50%;background:#fff;display:grid;place-items:center;font:400 26px var(--sans);font-style:normal}
.checks{list-style:none;padding:0;margin:0 0 20px;display:grid;gap:8px}
.checks li{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.45}
.checks .dot{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;color:#fff;margin-top:1px}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.no{background:#c2261a}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}

.preview-pane{background:var(--bg);overflow:auto;padding:16px 20px 40px;min-width:0}
.preview-tools{display:flex;justify-content:center;margin-bottom:14px;position:sticky;top:0;z-index:5}
.scaler{margin:0 auto;width:fit-content}
.page{width:210mm;min-height:297mm;background:#fff;box-shadow:0 2px 4px #15172b14,0 18px 50px #15172b26;padding:10mm;color:#1c1e2e;overflow-wrap:anywhere}

/* ============ resume ============ */
.page{--accent:#5266eb;--fs:10.5pt;font-size:var(--fs);line-height:1.42;font-family:"Avenir Next","Segoe UI",system-ui,sans-serif}
.page.f-serif{font-family:Georgia,"Iowan Old Style","Times New Roman",serif}
.page.f-humanist{font-family:"Gill Sans","Trebuchet MS",Calibri,sans-serif}
.page h1,.page h2,.page h3,.page p,.page ul{margin:0}
.page ul{padding-left:1.1em}
.page li{margin:.15em 0}
.page a{color:inherit;text-decoration:none}
.r-name{font-size:2.3em;line-height:1.05;font-weight:800;letter-spacing:-.01em}
.f-serif .r-name{font-weight:700}
.r-title{color:var(--accent);font-weight:600;font-size:1.15em;margin-top:.25em}
.r-contact{list-style:none;padding:0!important;display:flex;flex-wrap:wrap;gap:.2em 1.1em;font-size:.92em;margin-top:.6em!important}
.r-sec{margin-top:1.15em;break-inside:avoid-page}
.r-sec h2{font-size:.82em;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:800;margin-bottom:.55em;padding-bottom:.3em;border-bottom:1.5px solid var(--accent)}
.r-item{margin-bottom:.8em;break-inside:avoid}
.r-row{display:flex;justify-content:space-between;gap:1em;align-items:baseline}
.r-row b{font-size:1.04em}
.r-date{font-size:.88em;color:#5d6178;white-space:nowrap}
.r-sub{color:#4a4e69;font-size:.95em;margin-bottom:.2em}
.r-pills{display:flex;flex-wrap:wrap;gap:.35em}
.r-pills span{background:color-mix(in srgb,var(--accent) 11%,#fff);border-radius:99px;padding:.15em .7em;font-size:.92em;font-weight:600}
.r-photo{width:5.6em;height:5.6em;border-radius:50%;object-fit:cover}
.r-empty{color:#a3a6bb;font-style:italic}

/* sidebar */
.t-sidebar{display:grid;grid-template-columns:62mm 1fr;gap:9mm;padding:0!important}
.t-sidebar aside{background:color-mix(in srgb,var(--accent) 9%,#fff);padding:10mm 6mm;display:flex;flex-direction:column;gap:.2em;min-height:296mm}
.t-sidebar main{padding:10mm 10mm 10mm 0}
.t-sidebar aside .r-sec h2{border-bottom:0;padding:0;margin-bottom:.4em}
.t-sidebar aside .r-contact{flex-direction:column;margin-top:.9em!important}
.t-sidebar .r-pills span{background:#fff}
.t-sidebar .r-photo{width:7.5em;height:7.5em;margin:0 auto .6em;display:block}
.t-sidebar .r-ctitle{font-size:.82em;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:var(--accent);margin-top:1em}
/* classic */
.t-classic header{text-align:center;padding-bottom:.6em;border-bottom:2px solid var(--ink,#15172b)}
.t-classic .r-contact{justify-content:center}
.t-classic .r-sec h2{border-bottom:1px solid #c8cbdc;color:#15172b}
.t-classic .r-title{color:#4a4e69}
.t-classic .r-head{display:flex;flex-direction:column;align-items:center}
/* banner */
.t-banner{padding:0!important}
.t-banner header{background:var(--accent);color:#fff;padding:11mm 12mm 8mm;display:flex;gap:1.2em;align-items:center}
.t-banner .r-title{color:#fff;opacity:.9}
.t-banner .r-body{padding:2mm 12mm 12mm}
.t-banner .r-photo{border:3px solid #ffffff88}
.t-banner header>div{flex:1}
/* compact */
.t-compact .r-sec{display:grid;grid-template-columns:30mm 1fr;gap:5mm;border-top:1px solid #d8dbe8;padding-top:.7em}
.t-compact .r-sec h2{border:0;padding:0;margin:0}
.t-compact header{margin-bottom:.4em}

.modal{position:fixed;inset:0;background:#15172bcc;display:grid;place-items:center;z-index:50;padding:16px;backdrop-filter:blur(6px)}
.modal-card{background:#fff;border-radius:22px;padding:34px;max-width:520px;box-shadow:0 30px 80px #0006}
.modal-card h1{font:400 36px/1.1 var(--sans);margin:0 0 12px}
.modal-card p{color:var(--ink2);line-height:1.55}
.modal-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;z-index:60;box-shadow:0 10px 30px #0005}

@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

@media print{
  @page{size:A4;margin:0}
  html,body,.app{height:auto!important;background:#fff!important}
  .topbar,.editor,.mobile-toggle,.preview-tools,.toast,.modal{display:none!important}
  .workspace{display:block!important}
  .preview-pane{display:block!important;overflow:visible;padding:0;background:none}
  .scaler{width:auto;margin:0}
  .page{zoom:1!important;box-shadow:none!important;width:210mm;min-height:0}
  .page,.t-sidebar aside,.t-sidebar main,.t-banner .r-body{box-decoration-break:clone;-webkit-box-decoration-break:clone}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
.t-sidebar aside .r-row{flex-direction:column;gap:0}

/* ===== AI + new components ===== */
.btn.ai{background:#f1f1ff;border-color:#cfd0ff;color:#2b2bd0}
.btn.ai:hover{background:#e4e4ff}
.ai-top{border-color:#ffffff55!important}
.good{color:var(--ok)}

.choice:hover{border-color:var(--indigo);background:#f6f6ff}
.choice b{font-size:16px}.choice span{font-size:13.5px;color:var(--ink2)}
.choice:first-child{border-color:var(--coral);background:#fff6f3}
.linkbtn{background:none;border:0;color:var(--indigo);font-weight:700;padding:14px 4px 0;text-decoration:underline}
.modal-card.sheet{width:min(560px,100%);max-height:92vh;max-height:92dvh;overflow-y:auto;padding:26px}

.sheet .lead{margin-bottom:14px}
.iv-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.progress.light{flex:1;max-width:none;margin:0;background:var(--line)}

.iv-err{min-height:18px}
.loading{display:grid;justify-items:center;gap:12px;padding:30px 0;text-align:center}
.spin{width:46px;height:46px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--coral);animation:sp .9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.drop{display:grid;gap:4px;justify-items:center;text-align:center;border:2px dashed #b9bcdb;border-radius:14px;padding:22px;margin-bottom:14px;cursor:pointer;background:#fafaff}
.drop span{font-size:13px;color:var(--mute)}
.drop:hover,.drop.over{border-color:var(--indigo);background:#f0f0ff}
.cmp{display:grid;gap:10px;margin:12px 0}
.cmp>div{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14.5px;line-height:1.5}
.cmp .new{border-color:var(--indigo);background:#f6f6ff}
.cmp p{margin:4px 0 0}
.lbl{font-size:12px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em;display:block}
.tip ul{margin:6px 0 0;padding-left:18px}
.tabbar{display:none}

@media (max-width:980px){
  .app{grid-template-rows:auto 1fr auto}
  .topbar{padding:8px 14px}
  .topbar .progress,.saved,.top-actions .primary,.ai-top{display:none}
  .workspace{grid-template-columns:1fr;min-height:0}
  .workspace[data-pane=edit] .preview-pane{display:none}
  .workspace[data-pane=preview] .editor{display:none}
  .tabbar{display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid var(--line);padding:4px 6px calc(4px + env(safe-area-inset-bottom))}
  .tabbar button{border:0;background:none;display:grid;justify-items:center;gap:1px;padding:6px 2px;font-size:12px;font-weight:700;color:var(--mute);border-radius:12px;min-height:52px}
  .tabbar button i{font-style:normal;font-size:20px;line-height:1.1}
  .tabbar button[aria-selected=true]{color:var(--ink);background:var(--bg)}
  .step-body{padding:18px 16px 24px}
  .step-body h2{font-size:25px}
  .steps{padding:8px 10px}
  .step-nav{padding:10px 14px}
  .step-nav .btn{min-height:46px;min-width:110px}
  .step-nav .primary{flex:1;margin-left:10px}
  input[type=text],input[type=email],input[type=tel],input[type=url],input[type=month],textarea,select{font-size:16px;min-height:46px}
  .icon-btn{width:38px;height:38px}
  .chip.sug{padding:8px 12px}
  .preview-pane{padding:8px 8px 20px}
  .preview-tools{overflow-x:auto;justify-content:flex-start;padding-bottom:6px}
  .modal{align-items:end;padding:0}
  .modal-card.sheet{border-radius:22px 22px 0 0;width:100%;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:94dvh}
  .modal-card{border-radius:22px 22px 0 0;width:100%;padding:24px 18px calc(24px + env(safe-area-inset-bottom))}
  .modal-card h1{font-size:30px}
  .iv-nav{bottom:calc(-20px - env(safe-area-inset-bottom))}
  .tpl-grid{grid-template-columns:1fr 1fr}
}
@media (max-width:520px){.grid2{grid-template-columns:1fr}.brand-name{font-size:20px}}
@media print{.tabbar{display:none!important}}

.editor{background:var(--page);border-right:1px solid var(--line)}
.steps{border-bottom:1px solid var(--line);background:var(--page)}
.steps button{border-radius:999px;color:var(--ink2);font-weight:400}
.steps button[aria-current=step]{background:#fff;color:var(--ink);font-weight:500;box-shadow:var(--sh-md),0 0 0 1px var(--line)}

<body>
<div class="app" id="app">
  <header class="topbar">
    <div class="brand"><span class="logo" aria-hidden="true">F</span><span class="brand-name">Folio</span></div>
    <div class="progress" aria-label="Resume completeness"><div class="progress-bar" id="progressBar"></div><span id="progressText">0%</span></div>
    <div class="top-actions">
      <span class="saved" id="savedState" role="status" aria-live="polite">Saved</span>
      <button class="btn ghost ai-top" data-action="ai-menu">✨ AI</button>

        <button data-action="interview">✨ Answer questions to build my CV</button>

        <button data-action="linkedin">💼 LinkedIn Studio</button>
        <button data-action="load-sample">Load example resume</button>

        <button data-action="import-json">Open backup file…</button>

      </div>
    </div>
  </header>


  <main class="workspace" data-pane="edit">
    <section class="editor" aria-label="Resume editor">
      <nav class="steps" id="steps" aria-label="Steps"></nav>
      <div class="step-body" id="stepBody"></div>
      <footer class="step-nav">
        <button class="btn ghost" data-action="back" id="backBtn">← Back</button>

</div>

<div class="modal" id="welcome" hidden>

<script>/* Folio — resume builder. Zero dependencies, runs from any static host or file://.
   Architecture: single state object -> pure render functions (editor form, resume HTML)
   -> debounced autosave to localStorage. Editor uses event delegation + data-path binding. */
(function () {
'use strict';

/* ───────── state ───────── */
const KEY = 'folio.v1';
const uid = () => Math.random().toString(36).slice(2, 9);
const blank = () => ({
  v: 1, template: 'sidebar', accent: '#5266eb', font: 'sans', size: 10.5, photo: '',
  personal: { name: '', title: '', email: '', phone: '', location: '', website: '', linkedin: '' },
  summary: '',
  experience: [], education: [], skills: [], projects: [], certifications: [], languages: [],
  order: ['summary', 'experience', 'education', 'skills', 'projects', 'certifications', 'languages'],
  hidden: [], aiAdded: []
});
let S = load();
let step = 0;

function load() {
  try { const r = JSON.parse(localStorage.getItem(KEY)); if (r && r.v === 1) return Object.assign(blank(), r); } catch (e) {}
  return null;
}
let saveT;
function save() {
  const el = $('#savedState'); el.textContent = 'Saving…';
  clearTimeout(saveT);
  saveT = setTimeout(() => {
    try { localStorage.setItem(KEY, JSON.stringify(S)); el.textContent = 'Saved on this device'; }
    catch (e) { el.textContent = 'Not saved on this device. Use More > Save backup.'; }
  }, 350);
}

/* ───────── helpers ───────── */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const fmtDate = v => { const m = /^(\d{4})-(\d{2})$/.exec(v || ''); return m ? MON[+m[2] - 1] + ' ' + m[1] : (v || ''); };
const range = (a, b, cur) => { const s = fmtDate(a), e = cur ? 'Present' : fmtDate(b); return [s, e].filter(Boolean).join(' – '); };
const lines = t => String(t || '').split('\n').map(x => x.trim().replace(/^[-•*]\s*/, '')).filter(Boolean);
const url = u => /^https?:\/\//i.test(u) ? u : 'https://' + u;
const clean = u => String(u || '').replace(/^https?:\/\/(www\.)?/i, '').replace(/\/$/, '');
function getPath(o, p) { return p.split('.').reduce((a, k) => (a == null ? a : a[k]), o); }
function setPath(o, p, v) { const ks = p.split('.'); const l = ks.pop(); ks.reduce((a, k) => a[k], o)[l] = v; }
function toast(m) { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2600); }

/* ───────── content: steps, templates, sample ───────── */
const STEPS = [
  { id: 'basics', label: 'About you' }, { id: 'summary', label: 'Summary' }, { id: 'experience', label: 'Experience' },
  { id: 'education', label: 'Education' }, { id: 'skills', label: 'Skills' }, { id: 'more', label: 'Extras' },
  { id: 'design', label: 'Design' }, { id: 'review', label: 'Review & download' }
];
const TEMPLATES = [
  { id: 'sidebar', name: 'Aurora', note: 'Tinted sidebar. Great for one page.' },
  { id: 'classic', name: 'Ledger', note: 'Centered and traditional. Safest for ATS.' },
  { id: 'banner', name: 'Horizon', note: 'Bold colour header. Stands out.' },
  { id: 'compact', name: 'Index', note: 'Labels left, details right. Fits a lot.' }
];
const ACCENTS = ['#5266eb', '#111111', '#188554', '#c45000', '#7c3aed', '#c2185b', '#0f6fde'];
const VERBS = {
  Lead: ['Led', 'Managed', 'Directed', 'Coordinated', 'Mentored', 'Supervised'],
  Build: ['Built', 'Designed', 'Developed', 'Launched', 'Created', 'Implemented'],
  Improve: ['Improved', 'Increased', 'Reduced', 'Streamlined', 'Optimized', 'Accelerated'],
  Deliver: ['Delivered', 'Achieved', 'Won', 'Exceeded', 'Secured', 'Resolved']
};
const SKILL_SUG = ['Communication', 'Teamwork', 'Problem solving', 'Time management', 'Microsoft Excel', 'Customer service', 'Project management', 'Data analysis', 'Leadership', 'Quality assurance', 'Presentation', 'Adaptability'];
const SUM_STARTERS = [
  'Reliable [your job title] with [X] years of experience in [your field]. Known for [your strongest quality] and [second quality]. Looking to bring this to a [type of role] at a [type of company].',
  'Recent [your degree] graduate with hands-on experience in [skill or project]. Quick learner who [achievement or quality]. Eager to contribute to a [type of team].',
  '[Job title] who [what you do best], with a record of [result with a number]. Strong in [skill 1], [skill 2] and [skill 3].'
];
const WEAK = /^(responsible for|duties included|worked on|helped with|tasked with|in charge of)/i;

const SAMPLE = () => Object.assign(blank(), {
  template: 'sidebar', accent: '#5266eb',
  personal: { name: 'Amara Okafor', title: 'Quality & Food Safety Specialist', email: 'amara.okafor@example.com', phone: '+234 801 234 5678', location: 'Lagos, Nigeria', website: '', linkedin: 'linkedin.com/in/amaraokafor' },

function thumb(id) {
  const a = '#8a8fb5', b = '#d3d6e8';
  const bars = (x, y, w, n) => Array.from({ length: n }, (_, i) => `<rect x="${x}" y="${y + i * 7}" width="${w - (i % 3) * 8}" height="3" rx="1.5" fill="${b}"/>`).join('');
  const body = {
    sidebar: `<rect width="38" height="100" fill="#dfe0fb"/><circle cx="19" cy="16" r="8" fill="${a}"/>${bars(6, 32, 26, 6)}<rect x="46" y="8" width="60" height="7" rx="3" fill="${a}"/>${bars(46, 24, 68, 10)}`,
    classic: `<rect x="30" y="8" width="60" height="7" rx="3" fill="${a}"/><rect x="10" y="22" width="100" height="1.5" fill="${a}"/>${bars(10, 30, 100, 11)}`,
    banner: `<rect width="120" height="26" fill="#5266eb"/><rect x="10" y="9" width="50" height="7" rx="3" fill="#fff"/>${bars(10, 36, 100, 10)}`,
    compact: `<rect x="8" y="8" width="55" height="7" rx="3" fill="${a}"/>${[0, 1, 2].map(k => `<rect x="8" y="${26 + k * 24}" width="20" height="3" fill="${a}"/>${bars(36, 26 + k * 24, 76, 3)}`).join('')}`
  }[id];
  return `<svg viewBox="0 0 120 100" aria-hidden="true">${body}</svg>`;
}

function audit() {

  const p = S.personal;
  add(!!p.name.trim(), 'Name added.', 'Add your full name.', 8);
  add(/^\S+@\S+\.\S+$/.test(p.email), 'Email looks valid.', 'Add a valid email address so employers can reach you.', 10);
  add(p.phone.trim().length >= 7, 'Phone number added.', 'Add a phone number.', 6, true);
  add(!!p.title.trim(), 'Target job title added.', 'Add the job title you are aiming for.', 6, true);
  const sl = S.summary.trim().split(/\s+/).filter(Boolean).length;
  add(sl >= 25 && sl <= 90, 'Summary length is right.', sl < 25 ? 'Write a summary of 25 to 80 words.' : 'Shorten your summary to under 90 words.', 10, true);
  add(!/\[[^\]]+\]/.test(S.summary + S.experience.map(e => e.bullets).join()), 'No leftover [brackets].', 'Replace the [bracketed] placeholders with your own details.', 4);
  add(S.experience.length >= 1, 'Work experience added.', 'Add at least one job, internship or volunteer role.', 14);
  const b = S.experience.flatMap(e => lines(e.bullets));

  const nums = b.filter(x => /\d/.test(x)).length;
  add(b.length && nums / b.length >= .3, 'Good use of numbers and results.', 'Add numbers to more bullets (%, time saved, people, money).', 10, true);
  const weak = b.filter(x => WEAK.test(x)).length;

  add(S.education.length >= 1, 'Education added.', 'Add your education.', 6, true);
  add(S.skills.length >= 5, `${S.skills.length} skills listed.`, 'List at least 5 skills.', 8, true);
